# LLMGateway：把服務升級（或第一次之後的重裝）到指定的 tag（design 決定 2、3）。
# 只能手動觸發。經池的 SSH 跳板（部署專用金鑰在跳板機上只能轉發，MyLinuxPool#68）連過去，
# 那台以服務帳號 llmgw 登入，由 ~llmgw/.ssh/authorized_keys 強制執行 deploy/remote-deploy.sh 的 upgrade 動詞。
# 值只經過環境變數與 stdin，不上命令列、不寫進 log（GitHub 也會自動遮罩 secret）。
#
# 需要的 secret（值由本人設，AI 不經手；命名照本人的規則 <存取方>__<被存取方>__<動作>）：
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY        部署專用私鑰
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY_KNOWN_HOSTS    跳板機與 provider 的 host key（known_hosts 格式）
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY_JUMP           跳板機，格式 user@host:port
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY_TARGET         那台（經跳板看到的位址），格式 llmgw@127.0.0.1:<埠>，
#                             字面要和跳板機 permitopen 的 "127.0.0.1:<埠>" 一模一樣（MyLinuxPool#68）
# 連線資訊也放 secret，是因為本 repo 是 public，不把池的位址放在公開的 vars；
# ssh 的錯誤輸出也會把位址換成 [jump]／[target] 再印。
# repo 設定：environment「llmgateway-deploy」要設本人為 required reviewer；
# GH_LLMGATEWAY__POOL_SSH__DEPLOY_KNOWN_HOSTS 由 MyLinuxPool 提供的指紋建立，不要用 ssh-keyscan 現掃。
name: deploy-service

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的版本（lgw-vX.Y.Z）"
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: llmgateway-deploy
    timeout-minutes: 5
    steps:
      - name: Prepare SSH identity
        env:
          SSH_KEY: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY }}
          KNOWN_HOSTS: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lgw_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/lgw_known_hosts
          test -s ~/.ssh/lgw_deploy && test -s ~/.ssh/lgw_known_hosts

      - name: Upgrade service
        env:
          JUMP: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY_JUMP }}
          TARGET: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY_TARGET }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu -o pipefail
          printf '%s' "$TAG" | grep -Eqx 'lgw-v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}' || { echo "invalid tag" >&2; exit 2; }
          target_user_host="${TARGET%:*}"
          target_port="${TARGET##*:}"
          jump_host="${JUMP#*@}"; jump_host="${jump_host%:*}"
          target_host="${target_user_host#*@}"
          ssh -T -n \
              -i ~/.ssh/lgw_deploy -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/lgw_known_hosts -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=20 \
              -J "$JUMP" -p "$target_port" "$target_user_host" "upgrade $TAG" \
              2> >(sed -e "s|${jump_host}|[jump]|g; s|${target_host}|[target]|g" >&2)

      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/lgw_deploy ~/.ssh/lgw_known_hosts
