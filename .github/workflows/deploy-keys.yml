# LLMGateway：把五把 key 從本 repo 的 secret 部署到放服務的那台（design 決定 2）。
# 只能手動觸發。經會合點（池跳板機上的 sshproxy；部署公鑰由 MyLinuxPool#77 的 TUNNEL_EXTRA_PUBKEYS 登記）轉發，
# 到隧道守護公開在會合點 127.0.0.1:4711 的、服務那台的 sshd，以服務帳號 llmgw 登入，由 ~llmgw/.ssh/authorized_keys 強制執行 deploy/remote-deploy.sh 的 keys 動詞。
# 值只經過環境變數與 stdin，不上命令列、不寫進 log（GitHub 也會自動遮罩 secret）。
#
# 需要的 secret（值由本人設，AI 不經手；命名照本人的規則 <存取方>__<被存取方>__<動作>）：
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY        部署專用私鑰
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY_KNOWN_HOSTS    跳板機與服務那台的 host key（known_hosts 格式）
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY_JUMP           會合點，格式 sshproxy@<跳板機>:<埠>
#   GH_LLMGATEWAY__POOL_SSH__DEPLOY_TARGET         服務那台的 sshd（經會合點看到的位址），固定是 llmgw@127.0.0.1:4711
#   POOL_LLMGATEWAY__CLAUDE_PERSONAL__LLM、POOL_LLMGATEWAY__CLAUDE_COMPANY__LLM、POOL_LLMGATEWAY__OPENROUTER_API__LLM、POOL_LLMGATEWAY__OPENCODE_ZEN__LLM、POOL_LLMGATEWAY__OLLAMA_CLOUD__LLM
# 連線資訊也放 secret，是因為本 repo 是 public，不把池的位址放在公開的 vars；
# ssh 的錯誤輸出也會把位址換成 [jump]／[target] 再印。
# repo 設定：environment「llmgateway-deploy」要設本人為 required reviewer；
# GH_LLMGATEWAY__POOL_SSH__DEPLOY_KNOWN_HOSTS 由 MyLinuxPool 提供的指紋建立，不要用 ssh-keyscan 現掃。
name: deploy-keys

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-keys
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: llmgateway-deploy
    timeout-minutes: 5
    steps:
      - name: Prepare SSH identity
        env:
          SSH_KEY: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY }}
          KNOWN_HOSTS: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lgw_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/lgw_known_hosts
          test -s ~/.ssh/lgw_deploy && test -s ~/.ssh/lgw_known_hosts

      - name: Send key file over stdin
        env:
          JUMP: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY_JUMP }}
          TARGET: ${{ secrets.GH_LLMGATEWAY__POOL_SSH__DEPLOY_TARGET }}
          K_CLAUDE_PERSONAL: ${{ secrets.POOL_LLMGATEWAY__CLAUDE_PERSONAL__LLM }}
          K_CLAUDE_COMPANY: ${{ secrets.POOL_LLMGATEWAY__CLAUDE_COMPANY__LLM }}
          K_OPENROUTER: ${{ secrets.POOL_LLMGATEWAY__OPENROUTER_API__LLM }}
          K_OPENCODE_ZEN: ${{ secrets.POOL_LLMGATEWAY__OPENCODE_ZEN__LLM }}
          K_OLLAMA: ${{ secrets.POOL_LLMGATEWAY__OLLAMA_CLOUD__LLM }}
        run: |
          set -eu -o pipefail
          test -n "$JUMP" && test -n "$TARGET" || { echo "deploy connection secrets are not set" >&2; exit 2; }
          target_user_host="${TARGET%:*}"
          target_port="${TARGET##*:}"
          jump_host="${JUMP#*@}"; jump_host="${jump_host%:*}"
          target_host="${target_user_host#*@}"
          # printf 是 shell 內建指令，值不會出現在任何程序的命令列
          {
            printf 'CLAUDE_PERSONAL_OAUTH_TOKEN=%s\n' "$K_CLAUDE_PERSONAL"
            printf 'CLAUDE_COMPANY_OAUTH_TOKEN=%s\n' "$K_CLAUDE_COMPANY"
            printf 'OPENROUTER_API_KEY=%s\n' "$K_OPENROUTER"
            printf 'OPENCODE_ZEN_API_KEY=%s\n' "$K_OPENCODE_ZEN"
            printf 'OLLAMA_API_KEY=%s\n' "$K_OLLAMA"
          } | ssh -T \
              -i ~/.ssh/lgw_deploy -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/lgw_known_hosts -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=20 \
              -J "$JUMP" -p "$target_port" "$target_user_host" keys \
              2> >(sed -e "s|${jump_host}|[jump]|g; s|${target_host}|[target]|g" >&2)
          # 尾端的 keys 是動詞；那台若少了 command= 強制命令，sh -c keys 會失敗，stdin 不會被當指令執行

      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/lgw_deploy ~/.ssh/lgw_known_hosts
