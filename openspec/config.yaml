schema: spec-driven

context: |
  LLMGateway：一人公司所有 AI agent 共用的模型窗口。把本人的訂閱（Claude 公司／個人、Ollama Cloud、
  OpenRouter、OpenCode Zen、Antigravity）收成統一入口，並管理「哪台 worker、什麼角色、哪個訂閱、
  哪個 coding agent、哪個模型」的開關申請與紀錄。
  這是 public repo：不寫 MyBrain 的內容與私人資訊，不寫任何金鑰、token 的實際值（只寫變數名或佔位符）。
  工單規則以 FATESAIKOU/MyPMO 的工單規則為準（見 AGENTS.md）；change 要對應到本 repo 的工單號碼。
  文件用繁體中文。調查資料在 docs/research/。

rules:
  proposal:
    - 開頭寫對應的工單（例：#1）與上層工單
    - 有「不做」一節
  design:
    - 每個決定寫「為什麼」與被放棄的選項
